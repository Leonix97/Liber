function importar(texto){
  try{
    var obj = JSON.parse(texto);
    if(!obj || !Array.isArray(obj.frentes)) throw new Error("x");
    ed.cfg = sanitizeCfg(obj); markDirty();
    setMsg(["Configuración importada. Revísala y pulsa Guardar."],"ok");
  }catch(e){
    setMsg(["El texto o archivo no es una configuración válida."],"err");
  }
  render(); window.scrollTo(0,0);
}
function guardarConfig(){
  var publicarInicial = conectado() && editor && !cfgMeta.version;
  if(!ed.dirty && !publicarInicial){ salirConfig(); return; }
  var errs = validateCfg(ed.cfg);
  if(errs.length){ setMsg(errs,"err"); render(); window.scrollTo(0,0); return; }
  var nueva = sanitizeCfg(clone(ed.cfg));
  if(!conectado()){ cerrarConGuardado(nueva,lsSet(STORE_CFG,JSON.stringify(nueva)),"Configuración guardada en este celular."); return; }
  if(!editor){
    setMsg(["Para guardar cambios para todo el equipo activa el modo editor con tu PIN (arriba)."],"err");
    render(); window.scrollTo(0,0); return;
  }
  var bar = document.querySelector(".savebar .b-pri"); if(bar){ bar.textContent="Guardando…"; bar.disabled=true; }
  function enviar(force){
    api("saveConfig",{pin:editor.pin,config:nueva,baseVersion:cfgMeta.version,force:!!force}).then(function(j){
      if(j.conflict){
        var msg = "Otro editor"+(j.por?" ("+j.por+")":"")+" guardó la versión "+j.version+" mientras editabas.\n\n"+
                  "Aceptar: guardar tus cambios encima.\nCancelar: descartar los tuyos y cargar la suya.";
        if(confirm(msg)) return enviar(true);
        ultimaSync = 0;
        return syncConfig(true).then(function(){ ed=null; state.view="main"; state.flash="Se cargó la versión más reciente del equipo."; render(); });
      }
      cfgMeta = {version:j.version,fecha:j.fecha,por:j.por}; lsSet(STORE_META,JSON.stringify(cfgMeta));
      cerrarConGuardado(nueva,lsSet(STORE_CFG,JSON.stringify(nueva)),"Configuración v"+j.version+" guardada para todo el equipo.");
    },function(e){
      if(/PIN/i.test(e.message)){ editor=null; lsSet(STORE_EDITOR,"null"); }
      setMsg(["No se pudo guardar en el sistema: "+e.message+(e.server?"":". Revisa la señal e inténtalo de nuevo.")],"err");
      render(); window.scrollTo(0,0);
    });
  }
  enviar(false);
}
function cerrarConGuardado(nueva,ok,texto){
  cfg = nueva;
  ed = null; state.view = "main";
  var fr = getFrente(state.estructura);
  if(!fr){ state.estructura=""; state.tipo=""; }
  else if(fr.tipos.indexOf(state.tipo)<0) state.tipo="";
  if(prefs.supervisor && cfg.supervisores.indexOf(prefs.supervisor)<0){ prefs.supervisor=""; savePrefs(); }
  resetForm();
  state.flash = ok?texto:"Configuración aplicada, pero este navegador no permitió guardarla en el celular.";
  render(); window.scrollTo(0,0);
}
function salirConfig(){
  if(ed && ed.dirty && !confirm("Hay cambios sin guardar. ¿Descartarlos?")) return;
  ed = null; state.view = "main"; render(); window.scrollTo(0,0);
}

/* ── líneas del texto por liberación ── */
function resumenLineas(f,k){
  var o = (f.lineas&&f.lineas[k])||{}, por = {O:[],N:[],S:[]};
  (LINEAS[k]||[]).forEach(function(d){
    var v = o[d[0]]; if(!v || v===(d[3]||"S")) return;
    por[v].push(d[1].replace(/\s*\(.*\)$/,""));
  });
  var t = [];
  if(por.N.length) t.push("Nunca: "+por.N.join(", "));
  if(por.O.length) t.push("Opcional: "+por.O.join(", "));
  if(por.S.length) t.push("Siempre: "+por.S.join(", "));
  return t.join(" · ")||"Como viene por defecto";
}

    ]));

  return w;

  });
  kids.push(el("div",{class:"btns",style:"margin-top:4px"},[
    el("button",{class:"b-sec",type:"button",onclick:function(){ delete f.lineas[k]; ed.frDirty=true; render(); }},["Restablecer"])
  ]));
  app.appendChild(secCard("Líneas del texto",null,kids));

  var otros = ed.cfg.frentes.filter(function(o){ return o.id!==f.id && o.tipos.indexOf(k)>=0; });
  if(otros.length){
    ed.copiaSel = (ed.copiaSel||[]).filter(function(id){ return !!findBy(otros,"id",id); });
    var bCp = el("button",{class:"b-pri",type:"button",disabled:!ed.copiaSel.length},
      [ed.copiaSel.length?"Copiar a "+ed.copiaSel.length+" frente"+(ed.copiaSel.length>1?"s":""):"Elige frentes"]);
    bCp.addEventListener("click",function(){
      var n = 0;
      ed.copiaSel.forEach(function(id){
        var o = findBy(ed.cfg.frentes,"id",id); if(!o) return;
        o.lineas = o.lineas||{};
        if(f.lineas[k]) o.lineas[k] = clone(f.lineas[k]); else delete o.lineas[k];
        n++;
      });
      ed.copiaSel = []; ed.dirty = true; ed.frDirty = true;
      setMsg(["Configuración de “"+ed.cfg.tipos[k].corto+"” copiada a "+n+" frente"+(n>1?"s":"")+". Pulsa Aplicar y luego Guardar."],"ok");
      render(); window.scrollTo(0,0);
    });
    app.appendChild(secCard("Copiar a otros frentes","Aplica esta misma configuración de líneas en otros frentes que tienen esta liberación.",[
      multiCtl(ed.copiaSel,otros.map(function(o){return o.id;}),function(id){ var o=findBy(otros,"id",id); return o.corto||o.nombre; },
        function(id){ var i=ed.copiaSel.indexOf(id); if(i>=0) ed.copiaSel.splice(i,1); else ed.copiaSel.push(id); render(); }),
      el("div",{class:"btns"},[bCp])
    ]));
  }
  app.appendChild(el("div",{class:"savebar"},[
    el("span",null,["Líneas de "+ed.cfg.tipos[k].corto.toLowerCase()]),
    el("button",{class:"b-pri",type:"button",onclick:volver},["Listo"])
  ]));
}

/* ════════════════════════════════════════════════════════════════
   RENDER GENERAL
   ════════════════════════════════════════════════════════════════ */
function render(){
  var ae = document.activeElement;
  var keepId = (ae && ae.getAttribute) ? ae.getAttribute("data-fk") : null;
  var keepPos = null;
  if(keepId){ try{ keepPos = ae.selectionStart; }catch(e){} }

  var app = document.getElementById("app");
  app.innerHTML = "";
  if(state.view==="config") renderConfig(app);
  else if(state.view==="frente") renderFrente(app);
  else if(state.view==="lineas") renderLineas(app);
  else if(state.view==="hoy") renderDia(app);
  else { lastVisibleSig = visibleSignature(); renderMain(app); }

  if(keepId){
    var back = document.querySelector('[data-fk="'+keepId+'"]');
    if(back){ back.focus(); if(keepPos!=null){ try{ back.setSelectionRange(keepPos,keepPos); }catch(e){} } }
  }
}

/* arranque: recuerda el último frente usado */
var recienConectado = leerEnlace();
state.turno = turnoInicial();
if(prefs.frente && getFrente(prefs.frente)) state.estructura = prefs.frente;
resetForm();
if(recienConectado) state.flash = "Celular conectado al sistema del equipo.";
render();

/* sincronización con el equipo */
syncConfig(true).then(procesarCola);
window.addEventListener("online",function(){ syncConfig(true); procesarCola(); });
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){ syncConfig(false); procesarCola(); }
});
setInterval(function(){ if(cola.length) procesarCola(); },60000);

/* instalación como app (solo cuando se sirve por http/https) */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
